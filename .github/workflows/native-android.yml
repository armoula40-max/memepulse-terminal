name: Build Solana Signal Native Android
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref containing native-android
        required: true
        default: feat/realtime-demo-trading-and-app-icon
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools platforms;android-35 build-tools;35.0.0' }
      - name: Build APK and tests
        working-directory: native-android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Publish APK release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="solana-signal-${GITHUB_RUN_ID}"
          cp native-android/app/build/outputs/apk/debug/app-debug.apk Solana-Signal-debug.apk
          gh release create "$TAG" Solana-Signal-debug.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Solana Signal Native Android test build $GITHUB_RUN_NUMBER" --notes "Native Kotlin/Compose signal-only build. No wallet, signing, or automatic trading."

name: Build Solana Signal Native Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools platforms;android-35 build-tools;35.0.0' }
      - name: Build APK and tests
        working-directory: native-android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace
      - name: Publish APK release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="solana-signal-${GITHUB_RUN_ID}"
          APK="native-android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          cp "$APK" Solana-Signal-release.apk
          sha256sum Solana-Signal-release.apk
          gh release create "$TAG" Solana-Signal-release.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Solana Signal Native Android $GITHUB_RUN_NUMBER" --notes "Unsigned native Kotlin/Compose release-variant APK; it must be signed before installation. No wallet, transaction signing, or automatic trading."

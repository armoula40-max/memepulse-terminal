name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CI: true

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify project
        run: pnpm check && pnpm test && pnpm lint

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006'

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --no-configuration-cache -x lintVitalAnalyzeRelease -x lintVitalRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MemePulse-Terminal-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemePulse-Terminal-APK
          path: MemePulse-Terminal-release.apk
          if-no-files-found: error
          retention-days: 30

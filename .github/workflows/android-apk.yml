name: Build MemePulse Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CI: true
  EXPO_PUBLIC_LOCAL_ONLY: true
  EXPO_PUBLIC_PUMPPORTAL_LIVE: true

jobs:
  build-apk:
    name: Build and verify signed MemePulse APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate and stage release signing material
        shell: bash
        env:
          MEMEPULSE_KEYSTORE_BASE64: ${{ secrets.MEMEPULSE_KEYSTORE_BASE64 }}
          MEMEPULSE_STORE_PASSWORD: ${{ secrets.MEMEPULSE_STORE_PASSWORD }}
          MEMEPULSE_KEY_ALIAS: ${{ secrets.MEMEPULSE_KEY_ALIAS }}
          MEMEPULSE_KEY_PASSWORD: ${{ secrets.MEMEPULSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          required_secrets=(
            MEMEPULSE_KEYSTORE_BASE64
            MEMEPULSE_STORE_PASSWORD
            MEMEPULSE_KEY_ALIAS
            MEMEPULSE_KEY_PASSWORD
          )
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error title=Android signing is not configured::Missing repository Actions secret: ${secret_name}. See docs/android-release-signing.md."
              exit 1
            fi
          done

          keystore_path="$RUNNER_TEMP/memepulse-release.keystore"
          if ! printf '%s' "$MEMEPULSE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"; then
            rm -f "$keystore_path"
            echo "::error title=Invalid Android signing keystore::The configured keystore could not be decoded. Secret values were not logged."
            exit 1
          fi
          chmod 600 "$keystore_path"

          if ! keystore_info="$(keytool -list -keystore "$keystore_path" -storepass:env MEMEPULSE_STORE_PASSWORD -alias "$MEMEPULSE_KEY_ALIAS" 2>/dev/null)"; then
            rm -f "$keystore_path"
            echo "::error title=Invalid Android signing keystore::The configured keystore or key alias could not be opened. Check the repository secrets without sharing their values."
            exit 1
          fi
          store_type="$(printf '%s\n' "$keystore_info" | sed -n 's/^Keystore type: //p' | head -n 1)"
          if [[ "$store_type" != "JKS" && "$store_type" != "PKCS12" ]]; then
            rm -f "$keystore_path"
            echo "::error title=Unsupported Android keystore type::Use a JKS or PKCS12 release keystore."
            exit 1
          fi
          unset keystore_info

          {
            printf 'MEMEPULSE_KEYSTORE_PATH=%s\n' "$keystore_path"
            printf 'MEMEPULSE_STORE_TYPE=%s\n' "$store_type"
          } >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify MemePulse project
        run: pnpm check && pnpm test && pnpm lint

      - name: Setup Java 21 for native tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006"

      - name: Verify native Engine B and Room tests
        working-directory: native-android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --no-configuration-cache

      - name: Setup Java 17 for Expo release build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate MemePulse Android project
        run: npx expo prebuild --platform android --clean

      - name: Confirm release variant uses production signing
        shell: bash
        run: |
          set -euo pipefail
          gradle_file=android/app/build.gradle
          grep -Fq 'MEMEPULSE_RELEASE_SIGNING_CONFIG' "$gradle_file"
          grep -Fq 'signingConfig signingConfigs.release' "$gradle_file"
          grep -Fq 'validateMemepulseReleaseSigning' "$gradle_file"

      - name: Clean and build Android release
        working-directory: android
        env:
          MEMEPULSE_STORE_PASSWORD: ${{ secrets.MEMEPULSE_STORE_PASSWORD }}
          MEMEPULSE_KEY_ALIAS: ${{ secrets.MEMEPULSE_KEY_ALIAS }}
          MEMEPULSE_KEY_PASSWORD: ${{ secrets.MEMEPULSE_KEY_PASSWORD }}
        run: |
          ./gradlew clean --no-daemon --stacktrace --no-configuration-cache
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace --no-configuration-cache -x lintVitalAnalyzeRelease -x lintVitalRelease

      - name: Verify APK signature, identity, manifest, ABI, and checksum
        id: verify
        shell: bash
        env:
          MEMEPULSE_STORE_PASSWORD: ${{ secrets.MEMEPULSE_STORE_PASSWORD }}
          MEMEPULSE_KEY_ALIAS: ${{ secrets.MEMEPULSE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk_path=android/app/build/outputs/apk/release/app-release.apk
          unsigned_apk_path=android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [[ ! -s "$apk_path" || -e "$unsigned_apk_path" ]]; then
            echo "::error title=Signed MemePulse APK missing::Gradle did not produce the expected signed release APK. No artifact or release will be published."
            exit 1
          fi

          mapfile -t release_apks < <(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [[ "${#release_apks[@]}" -ne 1 || "${release_apks[0]}" != "$apk_path" ]]; then
            echo "::error title=Unexpected Android APK outputs::Expected exactly one standalone app-release.apk."
            exit 1
          fi

          unzip -tq "$apk_path"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          verify_log="$RUNNER_TEMP/memepulse-apksigner-verify.txt"
          if ! "$build_tools/apksigner" verify --verbose --print-certs "$apk_path" > "$verify_log" 2>&1; then
            echo "::error title=APK signature verification failed::The release artifact did not pass apksigner verification."
            cat "$verify_log"
            exit 1
          fi
          cat "$verify_log"
          grep -Eq '^Number of signers: [1-9][0-9]*$' "$verify_log"

          expected_cert_sha256="$(keytool -exportcert -alias "$MEMEPULSE_KEY_ALIAS" -keystore "$MEMEPULSE_KEYSTORE_PATH" -storepass:env MEMEPULSE_STORE_PASSWORD | sha256sum | awk '{print $1}')"
          actual_cert_sha256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$verify_log" | head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$actual_cert_sha256" || "$actual_cert_sha256" != "$expected_cert_sha256" ]]; then
            echo "::error title=APK certificate mismatch::The signer certificate does not match the configured MemePulse release keystore."
            exit 1
          fi

          if [[ -f android/app/debug.keystore ]]; then
            debug_cert_sha256="$(keytool -exportcert -alias androiddebugkey -keystore android/app/debug.keystore -storepass android 2>/dev/null | sha256sum | awk '{print $1}' || true)"
            if [[ -n "$debug_cert_sha256" && "$actual_cert_sha256" == "$debug_cert_sha256" ]]; then
              echo "::error title=Debug key rejected::The APK was signed with the Android debug certificate, not a production release key."
              exit 1
            fi
          fi

          expo_config="$(CI=1 npx expo config --type public --json)"
          expected_package="$(printf '%s' "$expo_config" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).android.package))')"
          expected_version="$(printf '%s' "$expo_config" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"
          expected_version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*$/\1/p' android/app/build.gradle | head -n 1)"
          if [[ -z "$expected_package" || -z "$expected_version" || -z "$expected_version_code" ]]; then
            echo "::error title=MemePulse identity missing::Could not determine the generated Android package/version."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${expected_version}" ]]; then
            echo "::error title=Release tag mismatch::Use a v-tag matching the Expo app version (${expected_version})."
            exit 1
          fi

          badging="$("$build_tools/aapt" dump badging "$apk_path")"
          package_line="$(printf '%s\n' "$badging" | grep '^package:' | head -n 1)"
          if [[ "$package_line" != *"name='${expected_package}'"* || "$package_line" != *"versionCode='${expected_version_code}'"* || "$package_line" != *"versionName='${expected_version}'"* ]]; then
            echo "::error title=APK identity mismatch::Package or version in the APK manifest does not match the MemePulse Expo configuration."
            printf '%s\n' "$package_line"
            exit 1
          fi

          min_sdk="$(printf '%s\n' "$badging" | awk -F "'" '/^sdkVersion:/ { print $2; exit }')"
          target_sdk="$(printf '%s\n' "$badging" | awk -F "'" '/^targetSdkVersion:/ { print $2; exit }')"
          abis="$(unzip -Z1 "$apk_path" | awk -F/ '$1 == "lib" && NF >= 3 { print $2 }' | sort -u | paste -sd, -)"
          sha256="$(sha256sum "$apk_path" | awk '{print $1}')"

          cp "$apk_path" MemePulse-Terminal-release.apk
          printf '%s  %s\n' "$sha256" "MemePulse-Terminal-release.apk" > MemePulse-Terminal-release.apk.sha256
          cat > MemePulse-Terminal-release.manifest.txt <<EOF
          applicationId=${expected_package}
          versionName=${expected_version}
          versionCode=${expected_version_code}
          minSdk=${min_sdk}
          targetSdk=${target_sdk}
          abis=${abis}
          signerCertificateSha256=${actual_cert_sha256}
          apkSha256=${sha256}
          EOF
          echo "APK SHA-256: ${sha256}"
          echo "Signer certificate SHA-256: ${actual_cert_sha256}"
          echo "applicationId=${expected_package} versionName=${expected_version} versionCode=${expected_version_code} minSdk=${min_sdk} targetSdk=${target_sdk} abis=${abis}"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Upload verified MemePulse APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemePulse-Terminal-APK
          path: |
            MemePulse-Terminal-release.apk
            MemePulse-Terminal-release.apk.sha256
            MemePulse-Terminal-release.manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${RUNNER_TEMP:-}" ]]; then
            rm -f "$RUNNER_TEMP/memepulse-release.keystore" "$RUNNER_TEMP/memepulse-apksigner-verify.txt"
          fi

  publish-release:
    name: Publish verified APK release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          name: MemePulse-Terminal-APK
          path: release-assets

      - name: Publish MemePulse APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/MemePulse-Terminal-release.apk
          test -s release-assets/MemePulse-Terminal-release.apk.sha256
          test -s release-assets/MemePulse-Terminal-release.manifest.txt
          gh release create "$GITHUB_REF_NAME" \
            release-assets/MemePulse-Terminal-release.apk \
            release-assets/MemePulse-Terminal-release.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MemePulse Terminal $GITHUB_REF_NAME" \
            --notes-file release-assets/MemePulse-Terminal-release.manifest.txt
